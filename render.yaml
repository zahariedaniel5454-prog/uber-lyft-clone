services:
  - type: web
    name: rido
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRIVER_AUTO_APPROVE
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rido-redis
          property: connectionString

  - type: keyvalue
    name: rido-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
